name: Deploy Maliha to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CNF.Web/package-lock.json

      - name: Install Angular dependencies
        working-directory: src/CNF.Web
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Angular application
        working-directory: src/CNF.Web
        run: npm run build

      - name: Verify Angular build output
        working-directory: src/CNF.Web
        run: |
          if (-not (Test-Path "dist/CNF.Web")) {
            Write-Error "Angular build output was not found at dist/CNF.Web"
            exit 1
          }

          Write-Host "Angular build output verified:"
          Get-ChildItem "dist/CNF.Web" -Recurse | Select-Object FullName

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/CNF.Web/dist/CNF.Web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4