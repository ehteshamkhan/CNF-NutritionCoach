name: Deploy Maliha to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CNF.Web/package-lock.json

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install Angular dependencies
        working-directory: src/CNF.Web
        run: npm install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Angular application
        working-directory: src/CNF.Web
        run: npm run build

      - name: Verify Angular build output
        working-directory: src/CNF.Web
        run: |
          if [ ! -d "dist/CNF.Web/browser" ]; then
            echo "Angular browser output was not found at dist/CNF.Web/browser"
            exit 1
          fi

          if [ ! -f "dist/CNF.Web/browser/index.html" ]; then
            echo "index.html was not found at dist/CNF.Web/browser/index.html"
            exit 1
          fi

          echo "Angular browser build output verified:"
          find dist/CNF.Web/browser -maxdepth 2 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/CNF.Web/dist/CNF.Web/browser

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
